name: Build Launcher EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyinstaller

      - name: Verify icon file exists
        run: |
          if (Test-Path "VSAPE.ico") {
            Write-Host "Icon found, size: $((Get-Item VSAPE.ico).Length) bytes"
          } else {
            Write-Error "VSAPE.ico not found in root!"
            exit 1
          }

      - name: Build Launcher with icon
        run: pyinstaller --onefile --windowed --clean --name "VSAPE工具箱" --icon=VSAPE.ico launcher.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VSAPE工具箱
          path: dist/VSAPE工具箱.exe
