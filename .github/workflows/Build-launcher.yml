name: Build Launcher EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pyinstaller --version

      - name: Build Launcher with Splash
        run: |
          pyinstaller --onefile --windowed --clean --name "VSAPE工具箱" `
            --splash "splash.png" `
            launcher.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VSAPE工具箱
          path: dist/VSAPE工具箱.exe
