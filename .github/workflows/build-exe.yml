name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --clean --name "VSA_MBO_PBO一键生成器" `
            --collect-all openpyxl `
            --collect-all PIL `
            --collect-all et_xmlfile `
            --hidden-import openpyxl `
            --hidden-import PIL `
            --hidden-import et_xmlfile `
            --hidden-import openpyxl.drawing.image `
            --hidden-import openpyxl.drawing.spreadsheet_drawing `
            --hidden-import xml.etree.ElementTree `
            --hidden-import xml.parsers.expat `
            --hidden-import collections.abc `
            update_gui.py

      - name: Upload EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: VSA_MBO_PBO一键生成器-Windows
          path: dist/VSA_MBO_PBO一键生成器.exe
